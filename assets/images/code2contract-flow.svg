<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Code to API contract flow</title>
  <desc id="desc">A simple diagram showing Spring code transformed into an OpenAPI contract and API documentation.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e7e2da" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312a24" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#f7f5f1"/>
  <rect width="800" height="500" fill="url(#grid)" opacity=".65"/>

  <text x="400" y="66" text-anchor="middle" fill="#171412" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">CODE → CONTRACT</text>
  <text x="400" y="92" text-anchor="middle" fill="#837b73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CONCEPT FLOW</text>

  <g filter="url(#shadow)">
    <rect x="48" y="136" width="212" height="226" rx="24" fill="#1d1b24"/>
    <circle cx="73" cy="162" r="5" fill="#f28c4b"/>
    <circle cx="91" cy="162" r="5" fill="#f2c14e"/>
    <circle cx="109" cy="162" r="5" fill="#70d6a3"/>
    <rect x="69" y="190" width="84" height="8" rx="4" fill="#a7f3d0"/>
    <rect x="69" y="217" width="150" height="7" rx="3.5" fill="#9da4f5" opacity=".86"/>
    <rect x="90" y="241" width="122" height="7" rx="3.5" fill="#f6a66e" opacity=".88"/>
    <rect x="90" y="265" width="142" height="7" rx="3.5" fill="#d8d5f7" opacity=".72"/>
    <rect x="69" y="299" width="113" height="7" rx="3.5" fill="#70d6a3" opacity=".86"/>
    <rect x="90" y="323" width="128" height="7" rx="3.5" fill="#9da4f5" opacity=".74"/>
  </g>
  <text x="154" y="400" text-anchor="middle" fill="#171412" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Spring code</text>

  <path d="M279 249h73" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="363" y="184" width="112" height="130" rx="28" fill="#eef0ff" stroke="#c9ccff" stroke-width="2"/>
    <path d="M398 213h28l15 15v51h-43z" fill="#fff" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M426 213v16h15" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M409 246h21M409 258h21M409 270h15" stroke="#70d6a3" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="419" y="348" text-anchor="middle" fill="#4f46e5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">OpenAPI</text>

  <path d="M494 249h55" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="560" y="124" width="194" height="250" rx="24" fill="#fff" stroke="#e0dcd5"/>
    <rect x="581" y="149" width="96" height="8" rx="4" fill="#28242f"/>
    <rect x="581" y="173" width="151" height="6" rx="3" fill="#d8d4ce"/>

    <g transform="translate(581 205)">
      <rect width="152" height="30" rx="8" fill="#ecf8f2" stroke="#70d6a3"/>
      <rect x="10" y="8" width="34" height="14" rx="5" fill="#70d6a3"/>
      <text x="27" y="19" text-anchor="middle" fill="#153a29" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">GET</text>
      <rect x="56" y="11" width="74" height="8" rx="4" fill="#b9b4ad"/>
    </g>
    <g transform="translate(581 245)">
      <rect width="152" height="30" rx="8" fill="#eef0ff" stroke="#a9adfa"/>
      <rect x="10" y="8" width="34" height="14" rx="5" fill="#4f46e5"/>
      <text x="27" y="19" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">POST</text>
      <rect x="56" y="11" width="63" height="8" rx="4" fill="#b9b4ad"/>
    </g>
    <g transform="translate(581 285)">
      <rect width="152" height="30" rx="8" fill="#fff5ed" stroke="#f2b58d"/>
      <rect x="10" y="8" width="34" height="14" rx="5" fill="#f28c4b"/>
      <text x="27" y="19" text-anchor="middle" fill="#4f2a14" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">PUT</text>
      <rect x="56" y="11" width="82" height="8" rx="4" fill="#b9b4ad"/>
    </g>
    <g transform="translate(581 325)">
      <rect width="152" height="30" rx="8" fill="#fff0f0" stroke="#efaaaa"/>
      <rect x="10" y="8" width="42" height="14" rx="5" fill="#e45a5a"/>
      <text x="31" y="19" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700">DELETE</text>
      <rect x="63" y="11" width="66" height="8" rx="4" fill="#b9b4ad"/>
    </g>
  </g>
  <text x="657" y="410" text-anchor="middle" fill="#171412" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Docs &amp; testing</text>
</svg>
