<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Hotel recommendation model workflow</title>
  <desc id="desc">A simple workflow from Expedia data through preprocessing and model comparison to five hotel clusters, with final tuned MAP at 5 results.</desc>
  <defs>
    <pattern id="hotel-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e7e2da" stroke-width="1"/>
    </pattern>
    <filter id="hotel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312a24" flood-opacity=".09"/>
    </filter>
    <marker id="hotel-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#f7f5f1"/>
  <rect width="800" height="500" fill="url(#hotel-grid)" opacity=".65"/>
  <text x="400" y="57" text-anchor="middle" fill="#171412" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">HOTEL RECOMMENDATION FLOW</text>

  <g filter="url(#hotel-shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(35 105)">
      <rect width="135" height="118" rx="22" fill="#fff" stroke="#e0dcd5"/>
      <ellipse cx="67.5" cy="37" rx="29" ry="11" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
      <path d="M38.5 37v30c0 6 13 11 29 11s29-5 29-11V37" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
      <text x="67.5" y="99" text-anchor="middle" fill="#171412" font-size="14" font-weight="700">Raw data</text>
    </g>

    <g transform="translate(220 105)">
      <rect width="135" height="118" rx="22" fill="#fff" stroke="#e0dcd5"/>
      <path d="M42 39h51M42 56h42M42 73h56" stroke="#70d6a3" stroke-width="8" stroke-linecap="round"/>
      <circle cx="92" cy="56" r="9" fill="#4f46e5"/>
      <text x="67.5" y="99" text-anchor="middle" fill="#171412" font-size="14" font-weight="700">Preprocess</text>
    </g>

    <g transform="translate(405 89)">
      <rect width="170" height="150" rx="22" fill="#fff" stroke="#e0dcd5"/>
      <text x="85" y="29" text-anchor="middle" fill="#171412" font-size="14" font-weight="700">Compare models</text>
      <rect x="23" y="45" width="124" height="24" rx="12" fill="#eef0ff"/>
      <text x="85" y="62" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">KNN</text>
      <rect x="23" y="78" width="124" height="24" rx="12" fill="#ecf8f2"/>
      <text x="85" y="95" text-anchor="middle" fill="#24704c" font-size="11" font-weight="700">Random Forest</text>
      <rect x="23" y="111" width="124" height="24" rx="12" fill="#fff5ed"/>
      <text x="85" y="128" text-anchor="middle" fill="#a84f19" font-size="11" font-weight="700">XGBoost</text>
    </g>

    <g transform="translate(625 105)">
      <rect width="140" height="118" rx="22" fill="#211e2c"/>
      <g fill="#70d6a3">
        <circle cx="41" cy="46" r="8"/><circle cx="70" cy="36" r="8"/><circle cx="99" cy="46" r="8"/>
        <circle cx="55" cy="70" r="8"/><circle cx="85" cy="70" r="8"/>
      </g>
      <text x="70" y="101" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Top 5 clusters</text>
    </g>
  </g>

  <g fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" marker-end="url(#hotel-arrow)">
    <path d="M181 164h25"/><path d="M366 164h25"/><path d="M586 164h25"/>
  </g>

  <g transform="translate(85 292)" font-family="Arial, Helvetica, sans-serif">
    <rect width="630" height="154" rx="24" fill="#fff" stroke="#e0dcd5" filter="url(#hotel-shadow)"/>
    <text x="28" y="35" fill="#171412" font-size="14" font-weight="700">MAP@5 after tuning</text>

    <text x="28" y="70" fill="#514b45" font-size="12" font-weight="700">Random Forest</text>
    <rect x="136" y="57" width="391" height="18" rx="9" fill="#70d6a3"/>
    <text x="542" y="71" fill="#24704c" font-size="12" font-weight="700">0.4096</text>

    <text x="28" y="105" fill="#514b45" font-size="12" font-weight="700">XGBoost</text>
    <rect x="136" y="92" width="387" height="18" rx="9" fill="#f28c4b"/>
    <text x="542" y="106" fill="#a84f19" font-size="12" font-weight="700">0.4052</text>

    <text x="28" y="140" fill="#514b45" font-size="12" font-weight="700">KNN</text>
    <rect x="136" y="127" width="287" height="18" rx="9" fill="#8b87ee"/>
    <text x="542" y="141" fill="#4f46e5" font-size="12" font-weight="700">0.3007</text>
  </g>
</svg>
